name: csm-ci secret contract probe
run-name: csm-ci secret contract probe ${{ inputs.correlation }}
on:
  workflow_dispatch:
    inputs:
      correlation:
        type: string
        required: true
permissions: {}
concurrency:
  group: csm-ci-secret-contract-probe
  cancel-in-progress: false
jobs:
  direct:
    uses: civitaspo/csm-ci-actions/.github/workflows/csm-ci-secret-contract-probe.yml@b99d243b4f07a56a9b85f87b254ae4555c8610b9
    with:
      correlation: ${{ inputs.correlation }}
    secrets:
      CSM_CI_SERVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
      CSM_CI_APPROVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_APPROVER_APP_PRIVATE_KEY }}
      CSM_CI_TERRAFORM_PROVIDER_GPG_PRIVATE_KEY: ${{ secrets.CSM_CI_TERRAFORM_PROVIDER_GPG_PRIVATE_KEY }}
      CSM_CI_TERRAFORM_PROVIDER_GPG_PASSPHRASE: ${{ secrets.CSM_CI_TERRAFORM_PROVIDER_GPG_PASSPHRASE }}
  nested:
    needs: direct
    uses: civitaspo/csm-ci-actions/.github/workflows/csm-ci-secret-contract-nested-probe.yml@b99d243b4f07a56a9b85f87b254ae4555c8610b9
    with:
      correlation: ${{ inputs.correlation }}
    secrets:
      CSM_CI_SERVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
      CSM_CI_APPROVER_APP_PRIVATE_KEY: ${{ secrets.CSM_CI_APPROVER_APP_PRIVATE_KEY }}
