name: csm-ci-spike-approve
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
      reviewer:
        required: true
        type: string
permissions: {}
jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: csm-ci
    steps:
      - id: server
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_SERVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_SERVER_APP_PRIVATE_KEY }}
          repositories: civitaspo/testing-csm-ci-client
          permission-contents: write
          permission-pull-requests: write
      - id: approver
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CSM_CI_APPROVER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CSM_CI_APPROVER_APP_PRIVATE_KEY }}
          repositories: civitaspo/testing-csm-ci-client
          permission-pull-requests: write
      - env:
          SERVER: ${{ steps.server.outputs.token }}
          APPROVER: ${{ steps.approver.outputs.token }}
          REVIEWER: ${{ inputs.reviewer }}
          PR: ${{ inputs.pr }}
          R: civitaspo/testing-csm-ci-client
        run: |
          head=$(GH_TOKEN=$SERVER gh api repos/$R/pulls/$PR --jq .head.sha)
          echo "head=$head"
          echo "merge before approval:"; GH_TOKEN=$SERVER gh api -X PUT repos/$R/pulls/$PR/merge -f sha=$head -f merge_method=squash 2>&1 | head -2 || true
          if [ "$REVIEWER" = server ]; then RT=$SERVER; else RT=$APPROVER; fi
          echo "approve as $REVIEWER:"; GH_TOKEN=$RT gh api -X POST repos/$R/pulls/$PR/reviews -f event=APPROVE -f commit_id=$head --jq '"review \(.id) by \(.user.login) state \(.state)"'
          sleep 5
          echo "reviewDecision: $(GH_TOKEN=$SERVER gh api graphql -f query='query($n:Int!){repository(owner:"civitaspo",name:"testing-csm-ci-client"){pullRequest(number:$n){reviewDecision mergeStateStatus}}}' -F n=$PR --jq '.data.repository.pullRequest|tostring')"
          echo "merge after approval:"; GH_TOKEN=$SERVER gh api -X PUT repos/$R/pulls/$PR/merge -f sha=$head -f merge_method=squash 2>&1 | head -2 || true
